name: Test Tempo API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Tempo endpoints
        run: |
          python - <<'PY'
          import requests

          urls = [
              "https://www.tempo.co/",
              "https://www.tempo.co/api/sajian/tempo/home"
          ]

          for url in urls:
              try:
                  r = requests.get(url, timeout=20)
                  print("URL:", url)
                  print("Status:", r.status_code)
                  print("Length:", len(r.content))
                  print("Nuxt Data:", "__NUXT_DATA__" in r.text)
                  print("---")
              except Exception as e:
                  print("Error:", str(e))
          PY
